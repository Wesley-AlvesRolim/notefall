<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary meta -->
    <title>notefall — Piano MIDI Visualizer in Your Browser</title>
    <meta
      name="description"
      content="A free browser-based piano visualizer. Load a MIDI, fix the notes right on the falling-notes view, and export a piano video. Play live or record from a MIDI keyboard. Free, no sign-up, and your files never leave your browser."
    />
    <meta
      name="keywords"
      content="piano visualizer, MIDI visualizer, falling notes, piano roll, browser piano, MIDI player, 88-key keyboard, MIDI to video"
    />
    <meta name="theme-color" content="#05060a" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://notefall.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="notefall" />
    <meta property="og:title" content="notefall — Piano MIDI Visualizer in Your Browser" />
    <meta
      property="og:description"
      content="Load a MIDI, fix the notes right on the falling-notes view, and export a piano video. Play live or record from a MIDI keyboard. Free, no sign-up, and your files never leave your browser."
    />
    <meta property="og:url" content="https://notefall.app/" />
    <meta property="og:image" content="https://notefall.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="notefall: glassy blue notes falling onto a piano keyboard, with the line “Load a MIDI, fix the notes, export the video. Free, no sign-up.”"
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ja_JP" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="notefall — Piano MIDI Visualizer in Your Browser" />
    <meta
      name="twitter:description"
      content="Load a MIDI, fix the notes right on the falling-notes view, and export a piano video. Play live or record from a MIDI keyboard. Free, no sign-up, and your files never leave your browser."
    />
    <meta name="twitter:image" content="https://notefall.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="notefall: glassy blue notes falling onto a piano keyboard, with the line “Load a MIDI, fix the notes, export the video. Free, no sign-up.”"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "notefall",
        "url": "https://notefall.app/",
        "description": "A free browser-based piano visualizer. Watch MIDI notes fall onto a 3D 88-key keyboard, play live, record, edit on the canvas, and export to video. All content is processed client-side and never uploaded.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web browser",
        "browserRequirements": "Requires WebGL and a viewport at least 1024px wide.",
        "image": "https://notefall.app/og-image.png",
        "inLanguage": ["en", "ja"],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body class="bg-neutral-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
